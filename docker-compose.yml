services:
  ml-training:
    profiles: ["training"]
    build:
      context: .
      dockerfile: ml/training/Dockerfile
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - .:/workspace
    command: ["sleep", "infinity"]

  ml-inference:
    build:
      context: .
      dockerfile: ml/inference/Dockerfile
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - .:/workspace
    ports:
      - "${ML_INFERENCE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  nestjs-service:
    build:
      context: ./api/nestjs-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ML_INFERENCE_URL: ${ML_INFERENCE_URL:-http://ml-inference:8000}
      API_PORT: ${API_PORT:-3000}
      MAX_BATCH_FILES: ${MAX_BATCH_FILES:-30}
    depends_on:
      ml-inference:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
